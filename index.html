<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HANWIDIAE DEPLOY</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
        body{background:linear-gradient(135deg,#1a103c,#2d1b69);color:#fff;min-height:100vh;padding:20px;}
        .container{max-width:600px;margin:0 auto;}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;}
        .logo-area{display:flex;align-items:center;gap:10px;}
        .logo-icon{width:50px;height:50px;background:#7c3aed;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;}
        .title h1{font-size:24px;}
        .title p{color:#b8a9d9;font-size:14px;}
        .connect-btn{background:linear-gradient(90deg,#7c3aed,#a855f7);border:none;padding:12px 24px;border-radius:10px;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;transition:0.3s;}
        .connect-btn:hover{transform:scale(1.05);}
        .tabs{display:flex;gap:5px;margin-bottom:25px;border-bottom:1px solid #443070;padding-bottom:10px;}
        .tab{padding:10px 20px;border-radius:8px;cursor:pointer;transition:0.3s;color:#b8a9d9;}
        .tab.active{background:#7c3aed20;color:#fff;font-weight:bold;}
        .actions{display:flex;gap:15px;margin-bottom:30px;}
        .btn-primary{background:linear-gradient(90deg,#7c3aed,#a855f7);border:none;padding:14px 30px;border-radius:10px;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;flex:1;}
        .btn-secondary{background:#3a2a66;border:none;padding:14px 30px;border-radius:10px;color:#b8a9d9;font-size:16px;cursor:pointer;flex:1;transition:0.3s;}
        .btn-secondary:hover{background:#4a3a77;}
        .form-card{background:#2d1b6980;border-radius:16px;padding:30px;border:1px solid #443070;}
        .form-group{margin-bottom:20px;}
        .form-label{display:block;margin-bottom:8px;color:#d4c8f0;font-weight:500;}
        .upload-box{border:2px dashed #6b52a8;border-radius:12px;padding:30px;text-align:center;cursor:pointer;transition:0.3s;}
        .upload-box:hover{border-color:#a855f7;background:#7c3aed10;}
        .browse-link{color:#a855f7;font-weight:bold;cursor:pointer;}
        input, textarea{width:100%;padding:14px;border-radius:8px;border:1px solid #5a4090;background:#1f1247;color:#fff;font-size:16px;}
        .status{margin-top:20px;padding:15px;border-radius:10px;display:none;}
        .status.success{background:#16a34a20;border:1px solid #16a34a;color:#86efac;display:block;}
        .status.info{background:#3b82f620;border:1px solid #3b82f6;color:#93c5fd;display:block;}
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="logo-area">
                <div class="logo-icon">⛓️</div>
                <div class="title">
                    <h1>HANWIDIAE DEPLOY</h1>
                    <p>Multi Chain · Multi Protocol</p>
                </div>
            </div>
            <button class="connect-btn" id="connectWallet">🔌 Connect Wallet</button>
        </div>

        <!-- TABS -->
        <div class="tabs">
            <div class="tab active" data-tab="zora">⚡ Zora</div>
            <div class="tab" data-tab="clanker">🔗 Clanker</div>
            <div class="tab" data-tab="history">⏳ History</div>
            <div class="tab" data-tab="trending">🔥 Trending</div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="actions">
            <button class="btn-primary" id="deployBtn">🚀 Deploy</button>
            <button class="btn-secondary" id="claimBtn">🎁 Claim Vesting</button>
        </div>

        <!-- FORM AREA -->
        <div class="form-card" id="formArea">
            <div class="form-group">
                <label class="form-label">Upload logo</label>
                <div class="upload-box" id="uploadBox">
                    <span style="font-size:30px;">🖼️</span>
                    <p style="margin-top:10px;color:#999;">PNG or JPG · optional 
                        <span class="browse-link" id="browseBtn">BROWSE</span>
                    </p>
                    <input type="file" id="fileInput" accept=".png,.jpg,.jpeg" style="display:none;">
                </div>
                <p id="fileName" style="margin-top:8px;color:#7c3aed;display:none;">✅ File terpilih: <span></span></p>
            </div>

            <div class="form-group">
                <label class="form-label">NAME</label>
                <input type="text" id="coinName" placeholder="Nama Koin Anda">
            </div>

            <div class="form-group">
                <label class="form-label">TICKER</label>
                <input type="text" id="coinTicker" placeholder="Contoh: HWD · Maks 24 huruf" maxlength="24">
            </div>

            <div class="form-group">
                <label class="form-label">DESCRIPTION</label>
                <textarea id="coinDesc" rows="4" placeholder="Ceritakan tentang koin ini..."></textarea>
            </div>

            <div class="status" id="statusMsg"></div>
        </div>
    </div>

    <script>
        // VARIABEL
        let walletConnected = false;
        let selectedFile = null;

        // 1. TAB AKTIF
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                showStatus(`Beralih ke: ${tab.dataset.tab.toUpperCase()} ✅`, 'info');
            });
        });

        // 2. CONNECT WALLET
        document.getElementById('connectWallet').addEventListener('click', async () => {
            if (!window.ethereum) {
                showStatus('⚠️ Pasang dompet kripto (seperti MetaMask) di browser dulu!', 'info');
                return;
            }
            try {
                const accounts = await window.ethereum.request({method: 'eth_requestAccounts'});
                walletConnected = true;
                const shortAddr = accounts[0].slice(0,6) + '...' + accounts[0].slice(-4);
                document.getElementById('connectWallet').textContent = '✅ ' + shortAddr;
                showStatus('Dompet terhubung! Siap buat koin 🎉', 'success');
            } catch (err) {
                showStatus('Gagal hubungkan dompet: ' + err.message, 'info');
            }
        });

        // 3. UPLOAD LOGO / BROWSE
        document.getElementById('browseBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });
        document.getElementById('uploadBox').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });
        document.getElementById('fileInput').addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                document.getElementById('fileName').style.display = 'block';
                document.getElementById('fileName').querySelector('span').textContent = selectedFile.name;
            }
        });

        // 4. DEPLOY
        document.getElementById('deployBtn').addEventListener('click', () => {
            const name = document.getElementById('coinName').value.trim();
            const ticker = document.getElementById('coinTicker').value.trim();
            const desc = document.getElementById('coinDesc').value.trim();

            if (!walletConnected) {
                showStatus('⚠️ Hubungkan dompet dulu dengan klik "Connect Wallet"', 'info');
                return;
            }
            if (!name || !ticker) {
                showStatus('⚠️ Isi Nama dan Kode (Ticker) koin dulu!', 'info');
                return;
            }
            showStatus(`🚀 Sedang menyiapkan koin "${name}" (${ticker})...`, 'info');
            setTimeout(() => {
                showStatus(`✅ Koin "${name}" berhasil dibuat! Siap dipublikasikan ke Zora 🎉`, 'success');
            }, 1500);
        });

        // 5. CLAIM VESTING
        document.getElementById('claimBtn').addEventListener('click', () => {
            if (!walletConnected) {
                showStatus('⚠️ Hubungkan dompet dulu', 'info');
                return;
            }
            showStatus('📋 Memeriksa saldo klaim... fitur akan segera aktif!', 'info');
        });

        // FUNGSI TAMPILKAN PESAN
        function showStatus(pesan, jenis) {
            const el = document.getElementById('statusMsg');
            el.className = 'status ' + jenis;
            el.textContent = pesan;
        }
    </script>
</body>
</html>
